# Environnement local complet : Azurite remplace Azure Storage, l'API et le
# worker tournent dans la meme image que la production.
#
#   docker compose up --build
#   http://127.0.0.1:8000

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: >
      azurite --skipApiVersionCheck --loose
      --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  api:
    build: .
    depends_on:
      - azurite
    environment: &storage
      STORE_BACKEND: azure
      STORAGE_ACCOUNT_URL: http://azurite:10000/devstoreaccount1
      # Renseigne dans .env (non versionne), a partir de .env.azurite.example.
      STORAGE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:?copier .env.azurite.example vers .env}
      LOG_LEVEL: INFO
    command: >
      sh -c "python scripts/bootstrap_storage.py || true;
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    build: .
    depends_on:
      azurite:
        condition: service_started
      api:
        # Le worker consomme une file que l'API cree au demarrage : sans cette
        # condition il demarre avant et echoue sur QueueNotFound.
        condition: service_healthy
    environment: *storage
    command: ["python", "-m", "app.worker"]
    # Le worker ne sert pas HTTP : la sonde de l'image ne s'applique pas.
    healthcheck:
      disable: true
